name: Publish website

# Builds the static export and publishes it to GitHub Pages.
# Settings → Pages → Source: "GitHub Actions". For a custom domain, add it in
# Settings → Pages → Custom domain and set NEXT_PUBLIC_SITE_URL there too (the
# workflow picks the origin up from configure-pages automatically for *.github.io).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v5
        id: pages
      - name: Static export
        run: node tools/build-site.mjs --out docs --no-zip
        env:
          RX_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Optional: point the contact form at Formspree/Getform/n8n instead of
          # composing an email. Create the secret only if you want real delivery
          # from the static host.
          NEXT_PUBLIC_FORM_ENDPOINT: ${{ secrets.NEXT_PUBLIC_FORM_ENDPOINT }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
